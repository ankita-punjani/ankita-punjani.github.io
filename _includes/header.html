<header class="site-header">
  <div class="site-shell header-bar">
    <a class="identity" href="{{ '/' | relative_url }}" aria-label="Ankita Punjani, home">
      <span class="identity-name">Ankita Punjani</span>
    </a>
    <nav class="primary-nav" aria-label="Main navigation">
      <ul>
        {% for item in site.data.navigation %}
          <li>
            <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
